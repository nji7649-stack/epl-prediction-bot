name: EPL Daily Match Fetcher

on:
  schedule:
    # 한국 시간 기준 매일 아침 8시 (UTC 기준 23시)에 자동 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # 우리가 원할 때 수동으로 버튼을 눌러 실행할 수 있게 해줍니다.

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 내 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 환경 세팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필요한 도구 설치 (requests)
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 축구 분석 로봇 실행!
      env:
        # 아까 만든 비밀 금고에서 API 키를 꺼내옵니다.
        FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
      run: python epl_bot.py
